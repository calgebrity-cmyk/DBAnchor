version: "3.8"

services:
  postgres-17:
    image: postgres:17-alpine
    container_name: dbanchor-test-pg17
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword123
      POSTGRES_DB: testdb_17
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb_17"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-16:
    image: postgres:16-alpine
