[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbanchor"
version = "0.1.0"
description = "Safe universal database developer-experience middleware and diagnostics layer for PostgreSQL."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "DBAnchor Maintainers", email = "maintainers@dbanchor.dev" },
]
keywords = [
    "postgresql",
    "database",
    "middleware",
    "diagnostics",
    "sqlalchemy",
    "alembic",
    "migrations",
    "developer-tools",
    "dx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
psycopg = ["psycopg[binary]>=3.1.0"]
psycopg2 = ["psycopg2-binary>=2.9.0"]
asyncpg = ["asyncpg>=0.29.0"]
all-drivers = [
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
dbanchor = "dbanchor.cli.main:app"
dbx = "dbanchor.cli.main:app"

[project.urls]
Homepage = "https://github.com/calgebrity-cmyk/DBAnchor"
Documentation = "https://github.com/calgebrity-cmyk/DBAnchor#readme"
Repository = "https://github.com/calgebrity-cmyk/DBAnchor.git"
Issues = "https://github.com/calgebrity-cmyk/DBAnchor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dbanchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/dbanchor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
